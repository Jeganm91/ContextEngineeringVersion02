<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Engineering RAG Assistant</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 25px;
        }
        .top-bar a, .top-bar button {
            color: #58a6ff;
            background: none;
            border: 1px solid #30363d;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
        }
        .top-bar button:hover, .top-bar a:hover {
            background-color: #21262d;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 25px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c9d1d9;
        }
        textarea {
            width: 100%;
            height: 90px;
            background-color: #0d1117;
            color: #f0f6fc;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            border-color: #58a6ff;
            outline: none;
        }
        .btn-submit {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-submit:hover {
            background-color: #2ea043;
        }
        .result-box {
            margin-top: 25px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            display: none;
        }
        .answer-title {
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 10px;
        }
        .answer-content {
            white-space: pre-wrap;
            line-height: 1.5;
            color: #c9d1d9;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 12px;
            background-color: #1f6feb;
            color: white;
        }
        .citations-section {
            margin-top: 20px;
            border-top: 1px solid #30363d;
            padding-top: 15px;
        }
        .citation-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .citation-source {
            font-weight: bold;
            color: #79c0ff;
            margin-bottom: 5px;
        }
        .citation-body {
            color: #8b949e;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="#">Retrieval & Prompt Config</a>
            <button onclick="resetConversation()">Reset Conversation</button>
        </div>

        <h1>==== Context Engineering RAG Assistant ====</h1>

        <form id="ragForm">
            <label for="queryInput">Enter your question:</label>
            <textarea id="queryInput" name="query" placeholder="Ask a question..." required></textarea>
            <br>
            <button type="submit" class="btn-submit" id="submitBtn">Submit</button>
        </form>

        <div id="resultBox" class="result-box">
            <div id="mcpBadge" class="badge" style="display:none;">Tool: MCP Real-Time Retrieval</div>
            <div class="answer-title">Answer:</div>
            <div id="answerText" class="answer-content"></div>

            <div id="citationsSection" class="citations-section" style="display:none;">
                <strong>Retrieved Context Sources:</strong>
                <div id="citationsList" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('ragForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const queryInput = document.getElementById('queryInput');
            const resultBox = document.getElementById('resultBox');
            const answerText = document.getElementById('answerText');
            const mcpBadge = document.getElementById('mcpBadge');
            const citationsSection = document.getElementById('citationsSection');
            const citationsList = document.getElementById('citationsList');

            const query = queryInput.value.trim();
            if (!query) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();

                resultBox.style.display = 'block';
                answerText.innerText = data.answer || "No response generated.";

                if (data.mcp_used) {
                    mcpBadge.style.display = 'inline-block';
                } else {
                    mcpBadge.style.display = 'none';
                }

                if (data.citations && data.citations.length > 0) {
                    citationsSection.style.display = 'block';
                    citationsList.innerHTML = '';
                    data.citations.forEach(c => {
                        const item = document.createElement('div');
                        item.className = 'citation-item';
                        item.innerHTML = `<div class="citation-source">📄 ${c.source} (Score: ${c.score || 'N/A'})</div><div class="citation-body">${c.content}</div>`;
                        citationsList.appendChild(item);
                    });
                } else {
                    citationsSection.style.display = 'none';
                }
            } catch (err) {
                resultBox.style.display = 'block';
                answerText.innerText = "Error: Could not connect to RAG backend service.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit";
            }
        });

        function resetConversation() {
            document.getElementById('queryInput').value = '';
            document.getElementById('resultBox').style.display = 'none';
        }
    </script>
</body>
</html>
